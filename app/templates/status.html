<!DOCTYPE html>
<html>
<head>

<title>DDNS Utility</title>

<style>

body{
    font-family:sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
    background:#f4f4f4;
}

.container{
    background:white;
    width:420px;
    padding:35px;
    border-radius:10px;
    box-shadow:0 2px 12px rgba(0,0,0,0.12);
    position:relative;
}

.settings{
    position:absolute;
    right:18px;
    top:14px;
}

.settings a{
    text-decoration:none;
    font-size:24px;
    color:#8ab2c4;
}

.logo{
    text-align:center;
    margin-bottom:20px;
}

.logo img{
    width:170px;
}

h1{
    text-align:center;
    margin-top:10px;
    margin-bottom:28px;
    color:#222;
}

.center{
    text-align:center;
}

.row{
    margin:18px 0;
}

.cloud-row{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
}

.cloud-toggle{
    display:flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
}

button{
    border:none;
    border-radius:24px;
    background:#f79b00;
    color:white;
    cursor:pointer;
    padding:12px 28px;
    font-size:15px;
}

button:hover{
    background:#e58c00;
}

select{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:4px;
}

.version{
    text-align:center;
    color:#999;
    font-size:12px;
    margin-top:22px;
}

</style>

</head>

<body>

<div class="container">

    <div class="settings">
        <a href="/setup">⚙</a>
    </div>

    <div class="logo">
        <img src="{{ url_for('static', filename='logo.png') }}">
    </div>

    <h1>DDNS Update Utility</h1>

    <div class="center">

        <div class="row">
            <strong>WAN IP:</strong>
            <span id="wan_ip">Loading...</span>
        </div>

        <div class="row cloud-row">

            <strong>DNS Record:</strong>

            <span id="dns_record">
                Loading...
            </span>

            <div
                class="cloud-toggle"
                onclick="toggleProxy()"
            >

                <span
                    id="cloudIcon"
                    style="font-size:24px;color:#999999;"
                >
                    ☁
                </span>

                <strong id="proxyText">
                    DNS Only
                </strong>

            </div>

        </div>

        <div class="row">
            <strong>Last Checked:</strong>
            <span id="last_checked">
                Loading...
            </span>
        </div>

        <div class="row">
            <strong>Status:</strong>
            <span id="engine_status">
                Loading...
            </span>
        </div>

        <div class="row">

            <label>
                Interval (minutes):
            </label>

            <br><br>

            <select
                id="interval"
                onchange="updateInterval()"
            >
                <option value="60">1</option>
                <option value="300">5</option>
                <option value="600">10</option>
                <option value="1800">30</option>
                <option value="3600">60</option>
            </select>

        </div>

        <br>

        <button onclick="forceSync()">
            Force Sync
        </button>

        <div class="version">
            Version 1.1
        </div>

    </div>

</div>

<script>

async function updateStatus(){

    const response =
        await fetch("/api/status");

    const data =
        await response.json();

    document.getElementById("wan_ip").innerText =
        data.wan_ip;

    document.getElementById("dns_record").innerText =
        data.dns_record;

    document.getElementById("last_checked").innerText =
        data.last_checked;

    document.getElementById("engine_status").innerText =
        data.engine_status;

    document.getElementById("interval").value =
        data.interval;

    if(data.proxied){

        document.getElementById("proxyText").innerText =
            "Proxied";

        document.getElementById("cloudIcon").style.color =
            "#f79b00";

    }
    else{

        document.getElementById("proxyText").innerText =
            "DNS Only";

        document.getElementById("cloudIcon").style.color =
            "#999999";

    }

}

async function forceSync(){

    await fetch(
        "/api/force_sync",
        {
            method:"POST"
        }
    );

    updateStatus();

}

async function updateInterval(){

    const interval =
        document.getElementById("interval").value;

    await fetch(
        "/api/update_interval",
        {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                interval:interval
            })
        }
    );

}

async function toggleProxy(){

    const current =
        document.getElementById("proxyText").innerText
        === "Proxied";

    const newState = !current;

    await fetch(
        "/api/update_proxy",
        {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                proxied:newState
            })
        }
    );

    updateStatus();

}

updateStatus();

setInterval(
    updateStatus,
    5000
);

</script>

</body>
</html>
