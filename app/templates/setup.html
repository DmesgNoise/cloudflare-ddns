<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cloudflare DDNS Setup</title>

<style>
:root{
    --cf-orange:#f48120;
    --cf-orange-dark:#e56f0f;
    --bg:#f4f6f9;
    --card:#ffffff;
    --text:#222;
    --muted:#666;
    --border:#d8dbe2;
    --danger:#d93025;
    --success:#137333;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#f7f8fb,#e9eef6);
    min-height:100svh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:24px 16px;
    color:var(--text);
}

.card{
    background:var(--card);
    width:min(460px,100%);
    border-radius:18px;
    box-shadow:0 12px 30px rgba(0,0,0,0.12);
    padding:32px;
}

.header{
    text-align:center;
    margin-bottom:28px;
}

.cloud-logo{
    font-size:44px;
    color:var(--cf-orange);
    line-height:1;
}

h1{
    margin:10px 0 4px;
    font-size:28px;
}

.subtitle{
    color:var(--muted);
    font-size:14px;
}

.section-title{
    margin-top:24px;
    margin-bottom:12px;
    font-size:15px;
    font-weight:700;
    color:#333;
    border-bottom:1px solid #eee;
    padding-bottom:8px;
}

label{
    display:block;
    font-weight:700;
    margin-bottom:8px;
    font-size:14px;
}

input,select{
    width:100%;
    padding:12px 14px;
    border:1px solid var(--border);
    border-radius:10px;
    font-size:15px;
    margin-bottom:18px;
    background:white;
    transition:all .2s ease;
}

input:focus,select:focus{
    outline:none;
    border-color:var(--cf-orange);
    box-shadow:0 0 0 3px rgba(244,129,32,0.15);
}

.readonly{
    background:#f0f1f3;
    color:#333;
}

.input-row{
    display:flex;
    gap:10px;
    align-items:center;
}

.input-row input{
    margin-bottom:18px;
}

.eye-btn{
    flex:0 0 48px;
    height:45px;
    margin-bottom:18px;
    border:none;
    border-radius:10px;
    background:#eef1f5;
    cursor:pointer;
    font-size:18px;
    transition:all .18s ease;
}

.eye-btn:hover{
    background:#e0e5eb;
    transform:translateY(-1px);
}

.btn{
    border:none;
    border-radius:12px;
    cursor:pointer;
    padding:13px 22px;
    font-size:15px;
    font-weight:700;
    transition:all .18s ease;
}

.btn:hover{
    transform:translateY(-1px);
    box-shadow:0 8px 18px rgba(0,0,0,0.12);
}

.btn-full{
    width:100%;
}

.orange{
    background:var(--cf-orange);
    color:white;
}

.orange:hover{
    background:var(--cf-orange-dark);
}

.gray{
    background:#eef1f5;
    color:#333;
}

.gray:hover{
    background:#e0e5eb;
}

.cloud-row{
    text-align:center;
    margin:6px 0 22px;
}

.cloud-toggle{
    cursor:pointer;
    user-select:none;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:10px 16px;
    border-radius:999px;
    background:#f2f3f5;
    transition:all .18s ease;
}

.cloud-toggle:hover{
    background:#eceff3;
    transform:translateY(-1px);
}

.cloud-icon{
    font-size:28px;
}

.status-msg{
    text-align:center;
    min-height:20px;
    margin:4px 0 18px;
    font-size:14px;
}

.status-msg.error{
    color:var(--danger);
}

.status-msg.success{
    color:var(--success);
}

.actions{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.version{
    text-align:center;
    color:#888;
    font-size:13px;
    margin-top:24px;
}

@media (max-width:480px){
    body{
        align-items:flex-start;
        padding:16px;
    }

    .card{
        padding:24px;
        border-radius:16px;
    }

    h1{
        font-size:24px;
    }

    .input-row{
        gap:8px;
    }
}
</style>
</head>

<body>

<div class="card">

    <div class="header">
        <div class="cloud-logo">☁</div>
        <h1>Cloudflare Setup</h1>
        <div class="subtitle">
            Configure your DDNS updater
        </div>
    </div>

    <form method="POST" onsubmit="return validateSetupForm();">

        {% if first_run %}
        <div class="section-title">Admin Login</div>

        <label>Admin Username</label>
        <input
            type="text"
            id="admin_username"
            name="admin_username"
            autocomplete="username"
            required
        >

        <label>Admin Password</label>
        <input
            type="password"
            id="admin_password"
            name="admin_password"
            autocomplete="new-password"
            required
        >

        <label>Confirm Password</label>
        <input
            type="password"
            id="admin_password_confirm"
            name="admin_password_confirm"
            autocomplete="new-password"
            required
        >
        {% endif %}

        <div class="section-title">Cloudflare</div>

        <label>Cloudflare API Token</label>

        <div class="input-row">
            <input
                type="password"
                id="token"
                name="token"
                value="{{ config.token }}"
                required
            >

            <button
                type="button"
                class="eye-btn"
                onclick="toggleSensitiveValues()"
                title="Show or hide sensitive values"
            >
                👁
            </button>
        </div>

        <button
            type="button"
            id="fetchBtn"
            class="btn orange btn-full"
            onclick="fetchDomains()"
        >
            Fetch Domains
        </button>

        <br><br>

        <label>Domain</label>
        <select
            id="zone_name"
            name="zone_name"
            onchange="resolveRecord()"
            required
        >
            {% if config.zone_name %}
            <option value="{{ config.zone_name }}" selected>{{ config.zone_name }}</option>
            {% else %}
            <option value="">Select Domain</option>
            {% endif %}
        </select>

        <label>Zone ID</label>
        <input
            type="password"
            id="zone_id"
            class="readonly sensitive-field"
            value="{{ config.zone_id }}"
            readonly
        >

        <label>Record ID</label>
        <input
            type="password"
            id="record_id"
            class="readonly sensitive-field"
            value="{{ config.record_id }}"
            readonly
        >

        <div class="section-title">Preferences</div>

        <label>Timezone Region</label>
        <select
            id="timezone_region"
            onchange="populateTimezones()"
        >
            <option value="north_america">North America</option>
            <option value="europe">Europe</option>
            <option value="asia">Asia</option>
            <option value="oceania">Australia / Oceania</option>
            <option value="other">UTC / Other</option>
        </select>

        <label>Timezone</label>
        <select
            id="timezone"
            name="timezone"
            data-current="{{ config.timezone }}"
        ></select>

        <div class="cloud-row">
            <label>Proxy Status</label>

            <div
                class="cloud-toggle"
                onclick="toggleProxy()"
            >
                <span
                    class="cloud-icon"
                    id="cloudIcon"
                >
                    ☁
                </span>

                <strong id="proxyText">
                    DNS Only
                </strong>
            </div>
        </div>

        <input
            type="hidden"
            id="proxied"
            name="proxied"
            value="{{ 'true' if config.proxied else 'false' }}"
        >

        <label>Interval (minutes)</label>
        <select name="interval">
            <option value="60" {% if config.interval == "60" %}selected{% endif %}>1</option>
            <option value="300" {% if config.interval == "300" %}selected{% endif %}>5</option>
            <option value="600" {% if config.interval == "600" %}selected{% endif %}>10</option>
            <option value="1800" {% if config.interval == "1800" %}selected{% endif %}>30</option>
            <option value="3600" {% if config.interval == "3600" %}selected{% endif %}>60</option>
        </select>

        <div
            id="statusMsg"
            class="status-msg"
        >
            {% if error %}
            {{ error }}
            {% endif %}
        </div>

        <div class="actions">
            <button
                type="submit"
                class="btn orange btn-full"
            >
                Save Settings
            </button>

            {% if not first_run %}
            <button
                type="button"
                class="btn gray btn-full"
                onclick="window.location='/'"
            >
                Back
            </button>
            {% endif %}
        </div>

    </form>

    <div class="version">
        Version {{ version }}
    </div>

</div>

<script>
let proxyEnabled = {{ 'true' if config.proxied else 'false' }};
let sensitiveVisible = false;

const timezoneGroups = {
    north_america: [
        ["Eastern — America/New_York", "America/New_York"],
        ["Central — America/Chicago", "America/Chicago"],
        ["Mountain — America/Denver", "America/Denver"],
        ["Arizona — America/Phoenix", "America/Phoenix"],
        ["Pacific — America/Los_Angeles", "America/Los_Angeles"],
        ["Alaska — America/Anchorage", "America/Anchorage"],
        ["Hawaii — Pacific/Honolulu", "Pacific/Honolulu"]
    ],
    europe: [
        ["UTC — Europe/London", "Europe/London"],
        ["Central Europe — Europe/Paris", "Europe/Paris"],
        ["Germany — Europe/Berlin", "Europe/Berlin"],
        ["Italy — Europe/Rome", "Europe/Rome"],
        ["Spain — Europe/Madrid", "Europe/Madrid"]
    ],
    asia: [
        ["Japan — Asia/Tokyo", "Asia/Tokyo"],
        ["Singapore — Asia/Singapore", "Asia/Singapore"],
        ["Hong Kong — Asia/Hong_Kong", "Asia/Hong_Kong"],
        ["India — Asia/Kolkata", "Asia/Kolkata"],
        ["Dubai — Asia/Dubai", "Asia/Dubai"]
    ],
    oceania: [
        ["Sydney — Australia/Sydney", "Australia/Sydney"],
        ["Melbourne — Australia/Melbourne", "Australia/Melbourne"],
        ["Brisbane — Australia/Brisbane", "Australia/Brisbane"],
        ["Perth — Australia/Perth", "Australia/Perth"],
        ["Auckland — Pacific/Auckland", "Pacific/Auckland"]
    ],
    other: [
        ["UTC", "UTC"]
    ]
};

function setStatus(message, type){
    const box = document.getElementById("statusMsg");

    box.innerText = message || "";
    box.className = "status-msg";

    if(type){
        box.classList.add(type);
    }
}

function updateProxyDisplay(){
    document.getElementById("proxied").value =
        proxyEnabled ? "true" : "false";

    document.getElementById("proxyText").innerText =
        proxyEnabled ? "Proxied" : "DNS Only";

    document.getElementById("cloudIcon").style.color =
        proxyEnabled ? "#f48120" : "#999999";
}

function toggleProxy(){
    proxyEnabled = !proxyEnabled;
    updateProxyDisplay();
}

function toggleSensitiveValues(){
    sensitiveVisible = !sensitiveVisible;

    const token = document.getElementById("token");
    const zoneId = document.getElementById("zone_id");
    const recordId = document.getElementById("record_id");

    const newType = sensitiveVisible ? "text" : "password";

    token.type = newType;
    zoneId.type = newType;
    recordId.type = newType;
}

function populateTimezones(){
    const region = document.getElementById("timezone_region").value;
    const timezone = document.getElementById("timezone");
    const current = timezone.dataset.current || "America/New_York";

    timezone.innerHTML = "";

    timezoneGroups[region].forEach(item=>{
        const option = document.createElement("option");

        option.text = item[0];
        option.value = item[1];

        if(item[1] === current){
            option.selected = true;
        }

        timezone.appendChild(option);
    });
}

function selectRegionForCurrentTimezone(){
    const current =
        document.getElementById("timezone").dataset.current
        || "America/New_York";

    for(const region in timezoneGroups){
        if(timezoneGroups[region].some(item=>item[1] === current)){
            document.getElementById("timezone_region").value = region;
            return;
        }
    }

    document.getElementById("timezone_region").value = "other";
}

async function fetchDomains(){
    const token =
        document.getElementById("token").value.trim();

    if(!token){
        setStatus("Enter API token first.", "error");
        return;
    }

    setStatus("Fetching domains...", "");

    const response = await fetch(
        "/api/fetch_zones",
        {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                token:token
            })
        }
    );

    const data = await response.json();
    const dropdown = document.getElementById("zone_name");

    dropdown.innerHTML =
        '<option value="">Select Domain</option>';

    document.getElementById("zone_id").value = "";
    document.getElementById("record_id").value = "";

    if(!data.success){
        setStatus(data.error || "Fetch failed", "error");
        return;
    }

    data.zones.forEach(zone=>{
        let option = document.createElement("option");
        option.value = zone.name;
        option.text = zone.name;
        dropdown.appendChild(option);
    });

    if(data.zones.length === 1){
        dropdown.value = data.zones[0].name;
        setStatus("1 domain found. Resolving IDs...", "success");
        await resolveRecord();
    }
    else if(data.zones.length > 1){
        setStatus(data.zones.length + " domains found. Select one to continue.", "success");
    }
    else{
        setStatus("No domains found for this token.", "error");
    }
}

async function resolveRecord(){
    const token =
        document.getElementById("token").value.trim();

    const zoneName =
        document.getElementById("zone_name").value;

    if(!zoneName){
        return;
    }

    setStatus("Resolving Zone ID and Record ID...", "");

    const response = await fetch(
        "/api/resolve_record",
        {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                token:token,
                zone_name:zoneName
            })
        }
    );

    const data = await response.json();

    if(data.success){
        document.getElementById("zone_id").value =
            data.zone_id;

        document.getElementById("record_id").value =
            data.record_id;

        setStatus("Domain ready.", "success");
    }
    else{
        setStatus(data.error || "Resolution failed", "error");
    }
}

function validateSetupForm(){
    {% if first_run %}
    const password =
        document.getElementById("admin_password").value;

    const confirm =
        document.getElementById("admin_password_confirm").value;

    if(password !== confirm){
        setStatus("Passwords do not match.", "error");
        return false;
    }
    {% endif %}

    const zoneId =
        document.getElementById("zone_id").value.trim();

    const recordId =
        document.getElementById("record_id").value.trim();

    if(!zoneId || !recordId){
        setStatus("Fetch and resolve your domain before saving.", "error");
        return false;
    }

    return true;
}

selectRegionForCurrentTimezone();
populateTimezones();
updateProxyDisplay();
</script>

</body>
</html>
