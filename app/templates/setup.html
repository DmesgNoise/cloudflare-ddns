<!DOCTYPE html>
<html>
<body>
    <form action="/setup" method="POST">
        <label>API Token</label>
        <input type="password" id="token" name="token" value="{{ config.token }}" required>
        <button type="button" onclick="fetchDomains()">Fetch Domains</button>
        
        <label>Domain Name</label>
        <input type="text" id="zone_name" name="zone_name" value="{{ config.zone_name }}" readonly required>
        
        <label>Timezone</label>
        <input type="text" name="timezone" value="{{ config.timezone }}">
        
        <label>Proxy Status</label>
        <select name="proxied">
            <option value="true" {% if config.proxied %}selected{% endif %}>Proxied (Orange)</option>
            <option value="false" {% if not config.proxied %}selected{% endif %}>DNS Only (Grey)</option>
        </select>

        <button type="submit">Save & Sync</button>
    </form>

    <script>
        async function fetchDomains() {
            const token = document.getElementById('token').value;
            const res = await fetch('/api/fetch_zones', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({token})});
            const data = await res.json();
            // Simplified: Just prompt or use a custom select. For now, we update the input directly.
            const domain = prompt("Enter one of these domains:", data.zones.map(z => z.name).join(", "));
            if (domain) document.getElementById('zone_name').value = domain;
        }
    </script>
</body>
</html>
