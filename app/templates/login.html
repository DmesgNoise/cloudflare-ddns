<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body { font-family: sans-serif; max-width: 400px; margin: 50px auto; }
        input { display: block; margin-bottom: 15px; padding: 10px; width: 100%; box-sizing: border-box; }
        button { padding: 10px 20px; background-color: #2096f3; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Login</h1>
    <form method="POST">
        <label>Master Password</label>
        <input type="password" name="password" required>
        <button type="submit">Login</button>
    </form>
</body>
</html>
